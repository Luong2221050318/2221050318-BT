<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color:#2F2C38;
            color: white;
        }
        .danh-sach-muc{
            list-style:none;

        .logo{

        }

            margin: 20px auto;
            border-radius: 20px;
        }
        .banner-anh{
            width:100%;
            border-radius: 20px;
        }
        .danh-sach-the-loai{
            width:95%;
            background-color:#ff0000;
            height: 20vh;
            margin: 20px auto;
        }
        .phim{
            display:flex;
            justify-content:space-between;
        }

    </style>
</head>
<body>
    <nav class="danh-muc">
        <ul class="danh-sach-muc">

            <li class="muc"><a class="lien-ket-muc" href="#">Home</a></li>
        </ul>
    </nav>
    <div class="chuc-nang">
        <div class="tim-kiem">
            <div class="thong-tin">
                <img class="avata" src="/Anh/treemnf.jpg" alt=""></a>
            </div>
        </div>
    </div>
    <main>
        <div class="banner">

        <div class="danh-sach-the-loai">
